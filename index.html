<!DOCTYPE html>
<html lang="it">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebAR - Quadro Parlante</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      #overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.9); z-index: 9999;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        color: white; text-align: center; padding: 24px; box-sizing: border-box;
      }
      #start-btn {
        margin-top: 24px; padding: 16px 36px; font-size: 18px; font-weight: bold;
        background-color: #ffffff; color: #000000; border: none; border-radius: 30px;
        cursor: pointer; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <!-- Schermata per sblocco audio/video e fotocamera -->
    <div id="overlay">
      <h2>Esperienza di Realtà Aumentata</h2>
      <p>Premi il pulsante per attivare audio e fotocamera, poi inquadra il dipinto.</p>
      <button id="start-btn">AVVIA ESPERIENZA</button>
    </div>

    <!-- Parametri di stabilizzazione OneEuroFilter integrati in mindar-image -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: yes; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 5;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="video-asset" 
          src="./Prova_001.mp4" 
          preload="auto" 
          loop 
          playsinline 
          webkit-playsinline 
          crossorigin="anonymous">
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target-anchor" mindar-image-target="targetIndex: 0">
        <a-plane 
          id="video-plane" 
          src="#video-asset" 
          position="0 0 0" 
          width="1" 
          height="1.778" 
          rotation="0 0 0"
          material="shader: flat;"
          visible="false">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('start-btn');
      const video = document.getElementById('video-asset');
      const plane = document.getElementById('video-plane');
      const sceneEl = document.querySelector('a-scene');
      const targetAnchor = document.getElementById('target-anchor');

      startBtn.addEventListener('click', () => {
        overlay.style.display = 'none';

        // Sblocca il canale audio e avvia il flusso del video sul tocco dell'utente
        video.muted = false;
        video.volume = 1.0;
        
        video.play().then(() => {
          // Si mette subito in pausa in attesa che l'utente inquadri il quadro
          video.pause();
        }).catch(err => {
          console.warn("Fallback autoplay audio:", err);
          // In caso di policy restrittive estreme, parte muto
          video.muted = true;
          video.play();
          video.pause();
        });

        // Avvia il tracking della fotocamera
        sceneEl.systems['mindar-image-system'].start();
      });

      // Target trovato: mostra il piano e riprende da dove si era interrotto
      targetAnchor.addEventListener('targetFound', () => {
        plane.setAttribute('visible', true);
        video.play();
      });

      // Target perso: mette in pausa video e audio e nasconde il piano
      targetAnchor.addEventListener('targetLost', () => {
        video.pause();
        plane.setAttribute('visible', false);
      });
    </script>
  </body>
</html>
